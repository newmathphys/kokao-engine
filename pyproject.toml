# Build system
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# Project metadata
[project]
name = "kokao-engine"
version = "1.0.0"
description = "Kokao Engine: Gradient Signal Inversion Engine"
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
authors = [
    {name = "Виталий Калиновский, В. Овсейчик", email = "newmathphys@users.noreply.github.com"}
]
keywords = ["kokao", "engine", "ai", "cognitive", "snn", "quantum", "rl", "dask", "pytorch"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Dependencies
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "pydantic>=2.0.0",
]

# Optional dependencies
[project.optional-dependencies]
quantum = ["qiskit>=0.45.0"]
distributed = ["ray>=2.9.0", "dask[distributed]>=2023.0.0"]
multimodal = ["transformers>=4.30.0", "pillow>=9.0.0"]
graph = ["neo4j>=5.10.0"]
api = ["fastapi>=0.100.0", "uvicorn>=0.23.0", "python-multipart>=0.0.6"]
snn = ["snntorch>=0.7.0"]
mlflow = ["mlflow>=2.10.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "mlflow>=2.10.0",
    "dask[distributed]>=2023.0.0",
]

# URLs
[project.urls]
Homepage = "https://github.com/newmathphys/kokao-engine"
Documentation = "https://kokao-engine.readthedocs.io"
Repository = "https://github.com/newmathphys/kokao-engine"
Issues = "https://github.com/newmathphys/kokao-engine/issues"
Changelog = "https://github.com/newmathphys/kokao-engine/blob/main/CHANGELOG.md"

# Package configuration
[tool.setuptools.packages.find]
where = ["src"]
include = ["kokao*"]

# Black configuration
[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]

# Ruff configuration
[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "D", "UP"]
ignore = ["D100", "D104"]

# Mypy configuration
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
